{{ define "main" }}
<main>
  <div class="post-list">
    {{ range .Pages }}
    <article class="post-item">
      <h2 class="post-title">
        <a href="{{ .Permalink }}">{{ .Title }}</a>
      </h2>
      <div class="post-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">
          {{ .Date.Format "Jan 2, 2006" }}
        </time>
        {{ with .Params.tags }}
        <span class="post-tags">
          {{ range . }}
          <a href="{{ "/tags/" | relURL }}{{ . | urlize }}">{{ . }}</a>
          {{ end }}
        </span>
        {{ end }}
      </div>
      <p class="post-summary">{{ .Summary }}</p>
    </article>
    {{ end }}
  </div>
</main>
{{ end }}
