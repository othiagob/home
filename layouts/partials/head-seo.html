{{/* ===== SEO complementar: canonical, author, favicon, JSON-LD ===== */}}
{{/* (description, Open Graph e Twitter Cards já são gerados pelo tema) */}}
<meta name="author" content="{{ .Site.Params.author | default .Site.Title }}">
<link rel="canonical" href="{{ .Permalink }}">

{{/* Favicon */}}
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">

{{ if .IsPage }}
<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
{{ end }}

{{/* JSON-LD */}}
<script type="application/ld+json">
{{ if .IsPage }}{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "author": { "@type": "Person", "name": {{ .Site.Params.author | jsonify }} },
  "url": {{ .Permalink | jsonify }}
}{{ else }}{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ .Site.Title | jsonify }},
  "url": {{ .Site.BaseURL | jsonify }}
}{{ end }}
</script>
