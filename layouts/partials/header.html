{{/* Partial override: header com logomarca OTB */}}
<header class="header">
  <div class="site-branding">
    <div class="site-title">
      <a href="{{ .Site.BaseURL }}">
        <span class="logo-otb">OTB</span>
      </a>
    </div>
  </div>
  <nav class="main-nav">
    <ul>
      {{ with .Site.Menus.main }}
        {{ range . }}
          <li><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
        {{ end }}
      {{ end }}
    </ul>
  </nav>
</header>
